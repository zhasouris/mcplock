# Dev == CI image. Run the green-commit gate with:
#   docker compose run --rm dev sh scripts/ci-verify.sh
# node_modules AND the pnpm content-addressable store live in named volumes (not
# the host bind mount) so installs are fast, hardlink cleanly, and never write
# into the repo. Only the lockfile lands in-repo.
services:
  dev:
    build: .
    image: mcplock-dev
    working_dir: /app
    environment:
      - CI=true
      - NPM_CONFIG_STORE_DIR=/pnpm-store
      # Persist the npm/npx cache so live-test server downloads are cached.
      - npm_config_cache=/npm-cache
    volumes:
      - .:/app
      - mcplock_node_modules:/app/node_modules
      - mcplock_pnpm_store:/pnpm-store
      - mcplock_npm_cache:/npm-cache

volumes:
  mcplock_node_modules:
  mcplock_pnpm_store:
  mcplock_npm_cache:
