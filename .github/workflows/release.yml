name: release

# Cut a GitHub release when a vX.Y.Z tag is pushed (the `release` skill pushes
# the tag). Builds the npm tarball and standalone Linux/Windows/macOS binaries
# in the pinned dev image, then publishes the release with generated notes.
# npm publish is optional and runs only when the NPM_TOKEN secret is set.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to (re)build a release for
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build dev image
        run: docker compose build dev
      - name: Green-commit gate
        run: docker compose run --rm dev sh scripts/ci-verify.sh

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build dev image
        run: docker compose build dev
      - name: Build release artifacts
        run: docker compose run --rm dev sh scripts/release-build.sh
      - name: Normalize artifact ownership (the dev image writes as root)
        run: sudo chown -R "$(id -u):$(id -g)" dist-release dist-bin
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist-release/*
      - name: Hand the Windows binary to the MSI job
        uses: actions/upload-artifact@v4
        with:
          name: mcplock-win-exe
          path: dist-bin/stage/windows-x64/mcplock.exe
          if-no-files-found: error

  windows-msi:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download the Windows binary (built on Linux)
        uses: actions/download-artifact@v4
        with:
          name: mcplock-win-exe
          path: packaging/windows
      - name: Resolve version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Put the dotnet tools dir on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      - name: Build the MSI
        shell: pwsh
        run: >
          wix build packaging/windows/mcplock.wxs
          -arch x64 -b packaging/windows
          -d Version=${{ steps.v.outputs.version }}
          -o "mcplock-${{ steps.v.outputs.version }}-x64.msi"
      - name: Attach the MSI to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: mcplock-*-x64.msi

  npm:
    needs: verify
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip when NPM_TOKEN is absent
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN not set — skipping npm publish (the GitHub release still ships)."
      - uses: actions/checkout@v7
        if: env.NPM_TOKEN != ''
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        if: env.NPM_TOKEN != ''
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install and build
        if: env.NPM_TOKEN != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish to npm (with provenance)
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
