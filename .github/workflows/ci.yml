name: ci

# Runs on every branch push (and PRs), applying the green-commit gate:
# typecheck + lint + tests WITH coverage thresholds + build, all in the pinned
# dev image. Coverage rules live in vitest.config.ts (82% floor) and fail the run.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: docker compose build dev
      - name: Green-commit gate (typecheck + lint + test+coverage + build)
        run: docker compose run --rm dev sh scripts/ci-verify.sh
      - name: Shellcheck scripts
        run: docker compose run --rm dev sh scripts/ci-shellcheck.sh

  # Non-gating stubs — planned, activated when implemented (CLAUDE.md).
  mutation:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: echo "Stryker mutation testing — planned; will gate src/core once wired."

  dast:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: echo "DAST hostile-server suite — planned; uses the fixture fault knobs."
