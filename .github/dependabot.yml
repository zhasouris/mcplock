version: 2
updates:
  # App dependencies (pnpm; Dependabot reads pnpm-lock.yaml under the npm ecosystem).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the Node runtime we target (engines: node >=20).
      # Keep it on the 20.x line rather than jumping to a newer major, which
      # would type against APIs not present in the runtime we build for.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  # Keep the GitHub Actions we pin (checkout, codeql-action, …) current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
